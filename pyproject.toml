[project]
name = "zerosyl-clean"
version = "0.1.0"
description = "Minimal ZeroSyl encoder: unsupervised syllable-scale units from WavLM-Large."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [
    { name = "Nicol Visser", email = "vissernicol@gmail.com" },
    { name = "Simon Malan" },
    { name = "Danel Slabbert" },
    { name = "Herman Kamper", email = "kamperh@gmail.com" },
]
dependencies = [
    "cupy-cuda13x>=14.2.0",
    "numpy>=2.5.2",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zerosyl"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.5",
    "torchcodec>=0.16.0",
]
